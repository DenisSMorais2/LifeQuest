<title>LifeQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a single dark phone-shell app — scrolling view + fixed bottom nav, sheets rise from the bottom. Dark-only by design. */
:root{
  --bg:#07061a; --bg-2:#0d0b24; --surface:#13112f; --surface-2:#1b1840; --line:rgba(170,160,255,.13); --line-2:rgba(170,160,255,.24);
  --fg:#eef0ff; --muted:#a3a5cf; --dim:#6f7199;
  --accent:#8b6cff; --accent-2:#5a8bff; --silver:#dfe3ff; --glow:rgba(139,108,255,.35);
  --good:#62d9a8; --warn:#f3b968; --flame:#ff9b5c;
  --c-mente:#a9b5ff; --c-corpo:#6fd6c3; --c-criacao:#c09bff; --c-carreira:#a8bdd4; --c-relacao:#ff93b4; --c-autocuidado:#e8cc8f; --c-recuperacao:#7fc9e8; --c-lazer:#ffb47c;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:16px; --r-sm:11px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 50% -10%, rgba(90,70,220,.22), transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{position:relative;max-width:440px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,rgba(20,16,56,.55),rgba(7,6,26,0) 320px),var(--bg);border-inline:1px solid var(--line)}
@media (max-width:460px){.app{border-inline:0}}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 16px 110px;scroll-behavior:smooth}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.display{font-family:var(--f-display);letter-spacing:.04em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.section{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.section > .row h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13px;transition:transform .15s, box-shadow .2s, background .2s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 28px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.25)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg)}
.btn-quiet{background:transparent;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:700;min-height:40px;padding:0 10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent);font-weight:700;font-size:13px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:5px}
.catdot{width:8px;height:8px;border-radius:50%;flex:none}
.input{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;min-height:46px}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{resize:vertical;min-height:64px}
label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;transition:background .2s,border-color .2s}
.chip[aria-pressed="true"]{background:rgba(139,108,255,.2);border-color:var(--accent);color:#fff}

/* top header */
.hero{display:flex;flex-direction:column;gap:14px}
.greet{display:flex;align-items:center;gap:12px}
.greet img{width:44px;height:44px;border-radius:12px}
.greet h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.lvlcard{position:relative;overflow:hidden;padding:16px 16px 14px}
.lvlcard::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;background:radial-gradient(circle,rgba(139,108,255,.35),transparent 65%);pointer-events:none}
.lvl-num{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,#b8b4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-mini{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px 6px;text-align:center}
.stat-mini b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat-mini span{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* current mission */
.mission{position:relative;overflow:hidden;border-color:var(--line-2);background:
  radial-gradient(420px 200px at 100% 0%, rgba(90,139,255,.18), transparent 60%),
  linear-gradient(180deg,#1a1646,#100e2c)}
.mission h3{font-size:24px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.mission .rewards{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
.xp-pill{background:rgba(139,108,255,.18);border-color:rgba(139,108,255,.45);color:#d9d1ff}
.coin-pill{background:rgba(243,185,104,.12);border-color:rgba(243,185,104,.35);color:#f7d9a8}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(98,217,168,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(98,217,168,0)}100%{box-shadow:0 0 0 0 rgba(98,217,168,0)}}
.banner{font-size:13px;padding:11px 14px;border-radius:13px;background:rgba(139,108,255,.1);border:1px solid rgba(139,108,255,.25);color:#d6d0ff}
.banner.warm{background:rgba(243,185,104,.08);border-color:rgba(243,185,104,.25);color:#f3dcb4}

/* task list */
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.task .t-time{font-size:12px;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums;width:44px;flex:none}
.task .t-title{font-weight:700;font-size:14.5px;line-height:1.25}
.task .t-sub{font-size:12px;color:var(--dim);margin-top:2px}
.task .t-xp{font-size:12px;font-weight:800;color:#cfc6ff;font-variant-numeric:tabular-nums;flex:none}
.task.done{opacity:.62}
.task.done .t-title{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.task.now{border-color:rgba(98,217,168,.45);background:linear-gradient(90deg,rgba(98,217,168,.08),var(--surface))}
.task.missed{border-style:dashed}
.check{width:30px;height:30px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;font-size:14px}
.task.done .check{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--muted)}
.tag.good{color:var(--good);background:rgba(98,217,168,.1)}
.tag.soft{color:var(--warn);background:rgba(243,185,104,.1)}
.tag.prio{color:#d9d1ff;background:rgba(139,108,255,.2)}

.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side button{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:13px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:13px;font-weight:700;min-width:0}
.side button span{flex:1;min-width:0}
.side button em{font-style:normal;color:var(--dim);font-size:11.5px;font-weight:800}
.side button.done{background:rgba(98,217,168,.07);border-color:rgba(98,217,168,.3);color:var(--muted)}
.side button.done em{color:var(--good)}
.quote{font-family:var(--f-display);font-size:16px;line-height:1.5;color:var(--silver);text-align:center;padding:18px 10px 4px;text-wrap:balance}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(7,6,26,.6),rgba(7,6,26,.97) 35%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:#fff}
.nav button[aria-current="page"] svg{filter:drop-shadow(0 0 8px var(--glow));color:var(--accent)}

/* sheets & overlays */
.scrim{position:absolute;inset:0;background:rgba(3,2,14,.66);backdrop-filter:blur(3px);z-index:40;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:linear-gradient(180deg,#171443,#0d0b24);border-top:1px solid var(--line-2);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:41;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:800}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:radial-gradient(600px 420px at 50% 20%, rgba(90,70,220,.35), transparent 65%), #06051a;animation:fade .25s ease;overflow-y:auto}
.celebrate{align-items:center;justify-content:center;text-align:center;padding:30px 24px;gap:12px}
.celebrate .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;background:linear-gradient(180deg,#fff,#b9b0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.burst{font-size:54px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.gain{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;animation:spark 1.4s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.toast{position:absolute;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;padding:13px 15px;border-radius:15px;background:rgba(27,24,64,.96);border:1px solid var(--line-2);box-shadow:0 18px 40px -12px rgba(0,0,0,.7);font-weight:700;font-size:14px;animation:drop .3s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:center}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}

/* mission mode */
.mm{padding:22px 20px calc(26px + env(safe-area-inset-bottom,0px));gap:16px;align-items:center;text-align:center}
.mm .top{width:100%;display:flex;justify-content:space-between;align-items:center}
.ring{position:relative;width:236px;height:236px;max-width:70vw;max-height:70vw}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* onboarding */
.onb{padding:28px 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;min-height:100%}
.onb .dots{display:flex;gap:6px;justify-content:center}
.onb .dots i{width:22px;height:4px;border-radius:4px;background:var(--line-2)}
.onb .dots i.on{background:var(--accent)}
.onb h1{font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:700;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:rgba(139,108,255,.14)}
.opt .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:13px;margin-left:auto}
.opt[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:#fff}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;border-radius:13px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--dim)}
.day b{font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
.day .mini{width:70%;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.day .mini i{display:block;height:100%;background:var(--accent)}
.day[aria-pressed="true"]{border-color:var(--accent);background:rgba(139,108,255,.14)}
.day.today b{color:#fff}
.day .meta{font-size:10px;line-height:1;min-height:12px}

/* stats */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px}
.tile b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile span{font-size:11.5px;color:var(--dim);font-weight:700}
.balance{display:flex;flex-direction:column;gap:9px}
.balance .row span:first-child{width:118px;font-size:12.5px;font-weight:700;flex:none}
.balance .row em{font-style:normal;font-size:12px;color:var(--dim);width:36px;text-align:right;font-variant-numeric:tabular-nums}
.chart text{fill:var(--dim);font-size:10px;font-weight:700;font-family:var(--f-body)}

/* journey map */
.map{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,#120f33,#0a0822)}
.map svg{display:block;width:100%;height:auto}
.region-label{font-family:var(--f-body);font-weight:800;font-size:11px;letter-spacing:.1em}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl:last-child{border-bottom:0}
.tl .d{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.moment{display:flex;gap:12px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.moment img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
.moment .e{font-size:22px;width:36px;text-align:center;flex:none}

/* profile */
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ach div{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:12px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:10.5px;font-weight:800;line-height:1.2;color:var(--muted)}
.ach div .i{font-size:24px;filter:grayscale(1) opacity(.35)}
.ach div.on{border-color:rgba(139,108,255,.4);background:linear-gradient(180deg,rgba(139,108,255,.15),var(--surface));color:var(--fg)}
.ach div.on .i{filter:none}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shop button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:700;text-align:center}
.shop button .sw{width:34px;height:34px;border-radius:10px}
.shop button.eq{border-color:var(--accent);background:rgba(139,108,255,.14)}
.shop button small{color:var(--dim);font-weight:800;font-size:11px}
.setting{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.switch{width:46px;height:28px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s, background .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:#fff}
.reward{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.reward:last-child{border-bottom:0}

/* ---------- responsive: different screen sizes and proportions ---------- */
.overlay .mm,.overlay .onb{width:100%;max-width:560px;margin-inline:auto}
.sheet{margin-inline:auto;max-width:600px}
@media (max-width:360px){
  body{font-size:14px}
  .view{padding-inline:12px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .side{grid-template-columns:1fr}
  .greet h1{font-size:18px}
  .lvl-num{font-size:28px}
  .mission h3{font-size:20px}
  .week{gap:3px}
  .day{font-size:10px}
  .day b{font-size:14px}
  .ach div{font-size:9.5px;padding:10px 2px}
  .balance .row span:first-child{width:98px;font-size:11.5px}
  .task{gap:9px;padding:11px 10px}
  .task .t-time{width:38px}
  .btn{padding:0 14px}
  .onb h1{font-size:24px}
  .shop{grid-template-columns:repeat(2,1fr)}
  .grid2 .field{min-width:0}
}
@media (max-height:560px) and (orientation:landscape){
  .overlay .ring{width:150px;height:150px}
  .overlay .ring .time{font-size:32px}
  .mm{gap:8px;padding-top:12px}
  .mm h2{font-size:20px}
  .celebrate{gap:8px;padding:16px}
  .burst{font-size:38px}
  .celebrate .big{font-size:24px}
  .onb{gap:12px;padding-top:14px}
  .onb img{width:84px;height:84px}
  .nav{padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
  .nav button{flex-direction:row;justify-content:center;gap:6px;font-size:11px;padding:6px 0}
  .nav button svg{width:18px;height:18px}
  .app .view{padding-bottom:76px}
  .app .sheet{max-height:94%}
}
@media (min-width:600px){
  body{font-size:15.5px}
  .app{max-width:760px}
  .view{padding:26px 28px 120px}
  .stats-row{gap:12px}
  .stat-mini{padding:12px 8px}
  .stat-mini b{font-size:18px}
  .side{grid-template-columns:repeat(3,1fr)}
  .grid2{grid-template-columns:repeat(3,1fr)}
  form .grid2{grid-template-columns:1fr 1fr}
  .ach{grid-template-columns:repeat(8,1fr)}
  .shop{grid-template-columns:repeat(4,1fr)}
  .week{gap:8px}
  .day{padding:12px 0 10px}
  .ring{width:280px;height:280px}
  .greet h1{font-size:24px}
  .greet img{width:52px;height:52px}
  .mission h3{font-size:28px}
  .lvl-num{font-size:40px}
  .map{max-width:520px;width:100%;margin-inline:auto}
  .sheet{border-radius:26px 26px 0 0;border-inline:1px solid var(--line-2)}
}
@media (min-width:1000px){
  .app{max-width:1180px;flex-direction:row;border-inline:1px solid var(--line)}
  .nav{position:relative;order:-1;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;width:112px;flex:none;padding:28px 10px;border-top:0;border-right:1px solid var(--line);background:rgba(7,6,26,.5)}
  .nav[hidden]{display:none}
  .nav button{padding:12px 0;font-size:11.5px}
  .nav button[aria-current="page"]{background:var(--surface-2)}
  .view{padding:34px 40px 60px}
  .view > *{max-width:820px;margin-inline:auto}
  .view > .onb{max-width:520px}
  .sheet{bottom:auto;top:50%;left:0;right:0;border-radius:24px;border:1px solid var(--line-2);max-height:86%;transform:translateY(-50%);animation:fade .2s ease;padding-bottom:22px}
}
@media (min-width:1000px) and (min-height:760px){
  .hero{gap:18px}
}
.calm *, .calm *::before, .calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.view{padding-top:calc(18px + env(safe-area-inset-top,0px))}
.overlay{padding-top:env(safe-area-inset-top,0px)}
@media (min-width:600px){.view{padding-top:calc(26px + env(safe-area-inset-top,0px))}}
@media (min-width:1000px){.view{padding-top:34px}.nav{padding-top:calc(28px + env(safe-area-inset-top,0px))}}
</style>
</head>

    <button data-act="tab" data-tab="jornada"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 9 8l4 7 3-4 5 9z"/><path d="M15.5 3.5l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg>Jornada</button>
    <button data-act="tab" data-tab="rotina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Rotina</button>
    <button data-act="tab" data-tab="evolucao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg>Evolução</button>
    <button data-act="tab" data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/></svg>Perfil</button>
  </nav>
  <div id="layer"></div>

</div>

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pkey=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
const addDays=(k,n)=>{const d=pkey(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const toMin=s=>{const[h,m]=String(s).split(":").map(Number);return h*60+(m||0)};
const fromMin=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+":"+pad(((m%60)+60)%60);
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const coinsFor=xp=>Math.max(5,Math.round(xp*0.3/5)*5);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const fmtH=min=>{const h=min/60;return h>=10?Math.round(h)+"h":(Math.round(h*10)/10).toString().replace(".",",")+"h"};
const weekStart=k=>{const d=pkey(k);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dkey(d)};

let DB=null,UID=null,profileRef=null,syncTimer=null,syncing=false;

async function flush(){

    if(dirty.profile){dirty.profile=false;await profileRef.set(profileBody())}

    for(const id of [...dirty.moments]){dirty.moments.delete(id);const m=S.moments.find(x=>x.id===id);if(m)await profileRef.collection("moments").doc(id).set(JSON.parse(JSON.stringify(m)))}
    for(const id of [...dirty.delMoments]){dirty.delMoments.delete(id);await profileRef.collection("moments").doc(id).delete()}
  }catch(e){}
  syncing=false;
  if(dirty.profile||dirty.days.size||dirty.moments.size||dirty.delMoments.size)scheduleSync();
}
function pushAll(){dirty.profile=true;Object.keys(S.log).forEach(k=>dirty.days.add(k));S.moments.forEach(m=>dirty.moments.add(m.id));flush()}
async function connectAccount(){

/* ---------- day model ---------- */
function tasksFor(k){
  const wd=pkey(k).getDay(), lg=S.log[k]||{};
  const list=S.routine.filter(t=>t.days.includes(wd)).map(t=>({...t}));
  (lg.extra||[]).forEach(t=>list.push({...t,extra:true}));
  list.forEach(t=>{const mv=lg.moved&&lg.moved[t.id];if(mv){const dur=toMin(t.end)-toMin(t.start);t.start=mv;t.end=fromMin(toMin(mv)+Math.max(dur,15));t.movedTo=mv}});
  return list.sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function statusOf(t,k){
  const lg=S.log[k]||{}; const tk=today();
  if(lg.done&&lg.done[t.id])return"done";
  if(lg.skipped&&lg.skipped[t.id])return"skipped";
  if(k<tk)return"missed"; if(k>tk)return"upcoming";
  const n=nowMin(),s=toMin(t.start),e=toMin(t.end)<=s?toMin(t.end)+1440:toMin(t.end);
  if(n>=s&&n<e)return"now"; if(n>=e)return"missed"; return"upcoming";
}
function currentMission(){const k=today();const ts=tasksFor(k);return ts.find(t=>statusOf(t,k)==="now")||ts.find(t=>statusOf(t,k)==="upcoming")||null}
function dayXp(k){const lg=S.log[k];if(!lg)return 0;let x=0;Object.values(lg.done||{}).forEach(d=>x+=d.xp||0);Object.values(lg.side||{}).forEach(d=>x+=(d&&d.xp)||0);x+=lg.bonus||0;return x}
function dayCoins(k){const lg=S.log[k];if(!lg)return 0;let c=0;Object.values(lg.done||{}).forEach(d=>c+=d.coins||0);Object.values(lg.side||{}).forEach(d=>c+=(d&&d.coins)||0);c+=lg.bonusCoins||0;return c}
function dayActive(k){const lg=S.log[k];return !!lg&&(Object.keys(lg.done||{}).length>0||Object.keys(lg.side||{}).length>0)}
function streakInfo(){
  let k=today(); if(!dayActive(k))k=addDays(k,-1);
  let n=0; while(dayActive(k)){n++;k=addDays(k,-1)}
  const broken=n===0&&Object.keys(S.log).some(dayActive);
  return{n,broken};
}
function totals(){
  const t={done:0,workouts:0,study:0,codeMin:0,studyMin:0,relMin:0,restMin:0,activeDays:0,moods:[],planned:0};
  Object.entries(S.log).forEach(([k,lg])=>{
    if(dayActive(k))t.activeDays++;
    if(typeof lg.mood==="number")t.moods.push(lg.mood);
    Object.values(lg.done||{}).forEach(d=>{
      t.done++;
      if(d.kind==="workout")t.workouts++;
      if(d.kind==="study")t.study++;
      const m=d.min||0;
      if(d.kind==="code")t.codeMin+=m;
      if(d.kind==="study"||d.kind==="lang")t.studyMin+=m;
      if(d.cat==="relacao")t.relMin+=m;
      if(d.cat==="recuperacao")t.restMin+=m;
    });
  });
  return t;
}
function weekCats(ref){
  const ws=weekStart(ref||today()), tk=today(), earned={}, planned={}, doneCount={};
  CAT_KEYS.forEach(c=>{earned[c]=0;planned[c]=0;doneCount[c]=0});
  for(let i=0;i<7;i++){
    const k=addDays(ws,i); if(k>tk)break;
    tasksFor(k).forEach(t=>{planned[t.cat]+=t.xp});
    const lg=S.log[k]; if(!lg)continue;
    Object.values(lg.done||{}).forEach(d=>{earned[d.cat]=(earned[d.cat]||0)+d.xp;doneCount[d.cat]++});
    Object.entries(lg.side||{}).forEach(([id,d])=>{if(d){earned[d.cat]=(earned[d.cat]||0)+d.xp}});
  }
  return{earned,planned,doneCount};
}

/* ---------- rewards engine ---------- */
function gain(xp,coins,k){
  const before=levelInfo(S.xp).lvl;
  S.xp=Math.max(0,S.xp+xp); S.coins=Math.max(0,S.coins+coins);
  const after=levelInfo(S.xp).lvl;
  const st=streakInfo(); if(st.n>S.bestStreak)S.bestStreak=st.n;
  persist(k?[k]:[]);
  return after>before?after:0;
}
function completeTask(t,k,opt){
  const lg=L(k); if(lg.done[t.id])return;
  const xp=opt?opt.xp:t.xp;
  const dur=Math.max(0,(toMin(t.end)-toMin(t.start)+1440)%1440||60);
  const min=Math.round(dur*(opt?xp/t.xp:1));
  const coins=coinsFor(xp);
  const wasActive=dayActive(k);
  lg.done[t.id]={xp,coins,cat:t.cat,kind:t.kind||"",min,at:Date.now(),reduced:opt?opt.label:null,title:t.title};
  delete lg.skipped[t.id];
  const lvUp=gain(xp,coins,k);
  celebrate({title:opt?"Versão reduzida concluída":"Missão concluída!",sub:opt?"Pequeno progresso também conta.":t.title,xp,coins,streak:!wasActive||true,lvUp});
  checkAchievements();
}
function reducedOptions(t){
  if(t.cat==="corpo")return[{label:"Treino reduzido",xp:40},{label:"Caminhada",xp:25},{label:"Alongamento",xp:15},{label:"Recuperação consciente",xp:10}].map(o=>({...o,xp:Math.min(o.xp,t.xp)}));
  return[{label:"Versão curta",xp:Math.max(5,Math.round(t.xp*0.6))},{label:"Só 10 minutos",xp:Math.max(5,Math.round(t.xp*0.3))}];
}
function checkAchievements(){
  const t=totals(), st=streakInfo(), w=weekCats();
  const cond={first:t.done>=1,streak7:Math.max(S.bestStreak,st.n)>=7,disc:t.workouts>=20,mente:t.study>=30,builder:t.codeMin>=1200,
    balanced:CAT_KEYS.every(c=>w.earned[c]>0),rest:w.doneCount.recuperacao>=7,d100:t.activeDays>=100};
  const fresh=ACH.filter(a=>cond[a.id]&&!S.ach[a.id]);
  fresh.forEach(a=>S.ach[a.id]=today());
  if(fresh.length){persist();fresh.forEach((a,i)=>setTimeout(()=>toast(a.i,"Conquista desbloqueada: "+a.n),2600+i*2200))}
}

function chime(big){
  if(!S.settings.sound)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=big?[523,659,784,1047]:[659,988];
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);const t0=audioCtx.currentTime+i*0.09;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.12,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.5);o.start(t0);o.stop(t0+.55)});
  }catch(e){}
}

function renderEvolucao(){
  const t=totals(), tk=today(), ws=weekStart(tk);
  const wx=[];for(let i=0;i<7;i++){const k=addDays(ws,i);wx.push({k,x:dayXp(k)})}
  const weekXp=wx.reduce((a,b)=>a+b.x,0);
  const mk=tk.slice(0,7);let monthXp=0;Object.keys(S.log).forEach(k=>{if(k.startsWith(mk))monthXp+=dayXp(k)});
  let possible=0,doneCnt=0;for(let i=0;i<7;i++){const k=addDays(ws,i);if(k>tk)break;tasksFor(k).forEach(x=>{possible++;if(statusOf(x,k)==="done")doneCnt++})}
  const rate=possible?Math.round(doneCnt/possible*100):0;
  const avgMood=t.moods.length?t.moods.reduce((a,b)=>a+b,0)/t.moods.length:null;
  const max=Math.max(100,...wx.map(w=>w.x)); const nice=Math.ceil(max/100)*100;
  const W=300,H=150,bw=26,gap=(W-30-7*bw)/6;
  let bars="";wx.forEach((w,i)=>{const h=w.x/nice*(H-30);const x=30+i*(bw+gap);const isT=w.k===tk;
    bars+=`<rect x="${x}" y="${H-18-h}" width="${bw}" height="${Math.max(h,2)}" rx="6" fill="${isT?"url(#bg1)":"rgba(139,108,255,.45)"}"/><text x="${x+bw/2}" y="${H-4}" text-anchor="middle">${WD[pkey(w.k).getDay()].slice(0,3)}</text>${w.x?`<text x="${x+bw/2}" y="${H-24-h}" text-anchor="middle" style="fill:var(--muted)">${w.x}</text>`:""}`});
  const grid=[0,.5,1].map(f=>{const y=H-18-f*(H-30);return`<line x1="28" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(170,160,255,.1)"/><text x="0" y="${y+3}">${Math.round(nice*f)}</text>`}).join("");
  const wc=weekCats();
  const pctOf=c=>wc.planned[c]?Math.min(100,Math.round(wc.earned[c]/wc.planned[c]*100)):(wc.earned[c]?100:0);
  const show=CAT_KEYS.filter(c=>wc.planned[c]||wc.earned[c]);
  const prod=["mente","criacao","carreira"].map(pctOf), rest=["recuperacao","lazer","relacao"].filter(c=>wc.planned[c]).map(pctOf);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  let msg="O teu equilíbrio desta semana está a ganhar forma.";
  if(avg(prod)-avg(rest)>25)msg="Esta semana estás muito focado em produtividade. Talvez seja um bom momento para descansar.";
  else if(avg(rest)-avg(prod)>30)msg="Tens dado espaço ao descanso e às pessoas. Quando quiseres, uma sessão de projeto ou estudo pode equilibrar a semana.";
  else if(wc.planned.corpo&&pctOf("corpo")<30&&pkey(tk).getDay()!==1)msg="O corpo tem tido menos atenção esta semana. Uma caminhada curta já conta.";
  return`<p class="eyebrow">Estatísticas</p><h1 class="display" style="font-size:26px;margin-top:4px">Evolução</h1>
  <div class="section">
    <div class="row between"><h2>XP desta semana</h2><span class="num" style="font-weight:800">${weekXp} XP</span></div>
    <div class="card chart" style="padding:14px 12px 8px"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="XP por dia desta semana"><defs><linearGradient id="bg1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5a8bff"/><stop offset="1" stop-color="#b58cff"/></linearGradient></defs>${grid}${bars}</svg></div>
  </div>
  <div class="section"><div class="grid2">
    <div class="tile"><b>${monthXp}</b><span>XP este mês</span></div>
    <div class="tile"><b>${t.done}</b><span>Missões concluídas</span></div>
    <div class="tile"><b>${rate}%</b><span>Taxa de conclusão (semana)</span></div>
    <div class="tile"><b>🔥 ${Math.max(S.bestStreak,streakInfo().n)}</b><span>Maior sequência</span></div>
    <div class="tile"><b>${fmtH(t.studyMin)}</b><span>Horas de estudo</span></div>
    <div class="tile"><b>${fmtH(t.codeMin)}</b><span>Horas de programação</span></div>
    <div class="tile"><b>${t.workouts}</b><span>Treinos realizados</span></div>
    <div class="tile"><b>${fmtH(t.relMin)}</b><span>Tempo de relacionamento</span></div>
    <div class="tile"><b>${fmtH(t.restMin)}</b><span>Tempo de descanso</span></div>
    <div class="tile"><b>${avgMood===null?"—":MOODS[Math.round(avgMood)].e}</b><span>Humor médio${avgMood===null?"":" · "+MOODS[Math.round(avgMood)].n}</span></div>
  </div></div>
  <div class="section"><div class="row between"><h2>Equilíbrio da semana</h2></div>
    <div class="card"><div class="balance">${show.map(c=>{const p=pctOf(c);return`<div class="row"><span>${CATS[c].e} ${CATS[c].n}</span><div class="bar grow"><i style="width:${p}%;background:var(--c-${c})"></i></div><em>${p}%</em></div>`}).join("")}</div>
    <p class="banner" style="margin-top:14px">${msg}</p></div>
  </div>
  <div class="section"><div class="row between"><h2>Sugestões</h2></div><div class="stack" style="gap:8px">${insights().map(s=>`<div class="card" style="padding:13px 14px;font-size:14px">💡 ${s}</div>`).join("")}</div></div>`;
}
function insights(){
  const out=[], recs=[];
  Object.entries(S.log).forEach(([k,lg])=>Object.values(lg.done||{}).forEach(d=>recs.push({...d,k})));
  if(recs.length<6)return["O LifeQuest está a aprender o teu ritmo. Depois de alguns dias, as sugestões aparecem aqui."];
  const code=recs.filter(r=>r.kind==="code"&&r.at);
  if(code.length>=3){const hrs={};code.forEach(r=>{const h=new Date(r.at).getHours();hrs[h]=(hrs[h]||0)+1});const best=+Object.entries(hrs).sort((a,b)=>b[1]-a[1])[0][0];out.push(`Normalmente completas programação com mais facilidade por volta das ${pad(best)}:00.`)}
  const byWd={};Object.keys(S.log).forEach(k=>{if(k>=today())return;const wd=pkey(k).getDay();tasksFor(k).filter(t=>t.kind==="study").forEach(t=>{byWd[wd]=byWd[wd]||{p:0,d:0};byWd[wd].p++;if(statusOf(t,k)==="done")byWd[wd].d++})});
  const rates=Object.entries(byWd).filter(([,v])=>v.p>=2).map(([w,v])=>[+w,v.d/v.p]);
  if(rates.length>=3){const avg=rates.reduce((a,b)=>a+b[1],0)/rates.length;const low=rates.sort((a,b)=>a[1]-b[1])[0];if(avg-low[1]>=0.2)out.push(`As tuas sessões de estudo são concluídas ${Math.round((avg-low[1])*100)}% menos às ${WD_LONG[low[0]].toLowerCase()}s. Talvez valha a pena mudar o horário nesse dia.`)}
  let wk=0;for(let i=0;i<7;i++){const lg=S.log[addDays(today(),-i)];if(lg)Object.values(lg.done||{}).forEach(d=>{if(d.kind==="workout")wk++})}
  if(wk>=5)out.push("Tens acumulado bastante atividade física. Considera colocar uma sessão de recuperação.");
  if(!out.length)out.push("Estás a manter um ritmo estável. Continua uma missão de cada vez.");
  return out;
}

/* ---------- mission mode + timer ---------- */
let MM=null,timerInt=null;
function stopTimer(){clearInterval(timerInt);timerInt=null}
function openMission(id){
  const k=today(),t=tasksFor(k).find(x=>x.id===id); if(!t)return;
  MM={t,k,dur:0,started:null,paused:0,pausedAt:null,phase:"ready"};
  drawMission();
}
function mmElapsed(){if(!MM.started)return 0;const end=MM.pausedAt||Date.now();return Math.max(0,(end-MM.started-MM.paused)/1000)}
function drawMission(){
  const {t,dur,phase}=MM;
  const el=mmElapsed(), total=dur*60, left=total?Math.max(0,total-el):el;
  const frac=total?Math.min(1,el/total):(phase==="run"?(el%60)/60:0);
  const C=2*Math.PI*100;
  const time=`${pad(Math.floor(left/60))}:${pad(Math.floor(left%60))}`;
  const msg=phase==="ready"?"Missão atual":MM.pausedAt?"Em pausa":"Continua. Só precisas começar.";
  openOverlay(`<div class="mm" style="display:flex;flex-direction:column;flex:1">
    <div class="top"><button class="btn-quiet" data-act="mmExit">‹ Sair</button><span class="pill">${CATS[t.cat].e} ${CATS[t.cat].n}</span></div>

    <div class="ring"><svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="rgba(170,160,255,.12)" stroke-width="10"/><circle id="mmArc" cx="110" cy="110" r="100" fill="none" stroke="url(#mmg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/><defs><linearGradient id="mmg"><stop offset="0" stop-color="#5a8bff"/><stop offset="1" stop-color="#b58cff"/></linearGradient></defs></svg>
      <div class="center"><span class="time" id="mmTime">${phase==="ready"&&!dur?"—":time}</span><span class="dim" style="font-size:12px;font-weight:800;letter-spacing:.1em">${dur?"FOCO "+dur+" MIN":phase==="run"?"TEMPO DECORRIDO":"ESCOLHE O TEMPO"}</span></div></div>
    ${phase==="ready"?`<div class="chips" style="justify-content:center">${[25,45,60,90,0].map(m=>`<button class="chip" data-act="mmDur" data-m="${m}" aria-pressed="${MM.dur===m}">${m?m+" min":"Livre"}</button>`).join("")}</div>
      <button class="btn btn-primary btn-block" style="margin-top:auto" data-act="mmStart">Começar</button>`
    :`<div class="row" style="width:100%;gap:8px;margin-top:auto"><button class="btn btn-ghost grow" data-act="mmPause">${MM.pausedAt?"Retomar":"Pausa"}</button><button class="btn btn-primary grow" data-act="mmDone">Concluir missão</button></div>
      <button class="btn btn-quiet" data-act="mmReduced">Terminar como versão reduzida</button>`}
  </div>`);
}
function tick(){
  if(!MM||MM.phase!=="run")return;
  const el=mmElapsed(),total=MM.dur*60;
  const left=total?Math.max(0,total-el):el;
  const tEl=$("#mmTime"),arc=$("#mmArc");
  if(tEl)tEl.textContent=`${pad(Math.floor(left/60))}:${pad(Math.floor(left%60))}`;
  if(arc){const C=2*Math.PI*100;const frac=total?Math.min(1,el/total):(el%60)/60;arc.setAttribute("stroke-dashoffset",C*(1-frac))}
  if(total&&el>=total&&!MM.pausedAt){stopTimer();pomodoroDone()}
}
function pomodoroDone(){
  const m=MM.dur, f={25:10,45:20,60:25,90:40}[m]||10, xp=m>=60?20:10, c=5;
  const lg=L(MM.k); lg.focus=Math.min(100,(lg.focus||0)+f); lg.bonus=(lg.bonus||0)+xp; lg.bonusCoins=(lg.bonusCoins||0)+c;

      lg.done[t.id]={xp:x,coins:coinsFor(x),cat:t.cat,kind:t.kind||"",min:Math.round(dur*(red?x/t.xp:1)),at:d.getTime(),reduced:red?red.label:null,title:t.title};xp+=x;coins+=coinsFor(x)}});

  tab:d=>{tab=d.tab;try{history.replaceState(null,"","#"+tab)}catch(e){}render();$("#view").scrollTop=0},
  closeSheet:closeLayer, closeLayer:closeLayer,
  celebDone:d=>{const lv=+d.lv;if(lv)levelUp(lv);else closeLayer();render()},
  lvThen:d=>{const lv=+d.lv;if(lv)levelUp(lv);else closeLayer();render()},
  taskTap:d=>{const t=findTask(d.id,d.k);if(!t)return;const st=statusOf(t,d.k);
    if(st==="done"){openSheet(`<h2>${esc(t.title)}</h2><p class="muted" style="margin-top:6px">Missão concluída. Bom trabalho.</p><button class="btn btn-ghost btn-block" style="margin-top:16px" data-act="undo" data-id="${esc(t.id)}" data-k="${d.k}">Desfazer conclusão</button>`);return}
    if(st==="missed"||st==="skipped")return missedSheet(t,d.k);
    if(st==="now"&&d.k===today())return openMission(t.id);
    openSheet(`<p class="eyebrow">${t.start}–${t.end}</p><h2 style="margin-top:6px">${esc(t.title)}</h2><div class="rewards row" style="margin:12px 0">${catPill(t.cat)}<span class="pill xp-pill">+${t.xp} XP</span><span class="pill coin-pill">+${coinsFor(t.xp)} 🪙</span></div>
      <div class="stack" style="gap:8px"><button class="btn btn-primary btn-block" data-act="mission" data-id="${esc(t.id)}">⚡ Modo missão</button><button class="btn btn-ghost btn-block" data-act="done" data-id="${esc(t.id)}" data-k="${d.k}">Marcar como concluída</button><button class="btn btn-quiet btn-block" data-act="resched" data-id="${esc(t.id)}">Mudar horário</button></div>`)},
  mission:d=>openMission(d.id),
  quickDone:d=>{const t=findTask(d.id);if(t)completeTask(t,today());render()},
  done:d=>{const t=findTask(d.id,d.k);if(t){closeLayer();completeTask(t,d.k||today());render()}},
  doneReduced:d=>{const t=findTask(d.id,d.k);if(!t)return;const o=reducedOptions(t)[+d.i];closeLayer();completeTask(t,d.k,o);render()},
  reduced:d=>{const t=findTask(d.id,d.k||today());if(t)reducedSheet(t,d.k||today())},
  undo:d=>{const lg=L(d.k),x=lg.done[d.id];if(!x)return;S.xp=Math.max(0,S.xp-x.xp);S.coins=Math.max(0,S.coins-x.coins);delete lg.done[d.id];persist([d.k]);closeLayer();render()},
  skip:d=>{const k=d.k||today();L(k).skipped[d.id]=true;persist([k]);closeLayer();toast("🌿","Missão saltada. Uma missão de cada vez.");render()},
  resched:d=>{const t=findTask(d.id);if(t)reschedSheet(t)},
  later:d=>{const n=nowMin();const m=Math.ceil((n+60)/30)*30;if(m>=24*60){ACT.moveDay({id:d.id,day:addDays(today(),1)});return}ACT.moveTo({id:d.id,time:fromMin(m)})},
  moveTo:d=>{const k=today();L(k).moved[d.id]=d.time;delete L(k).skipped[d.id];persist([k]);closeLayer();toast("🕗","Missão movida para as "+d.time+".");render()},
  moveDay:d=>{const k=today(),t=findTask(d.id);if(!t)return;const lg=L(k);lg.skipped[d.id]=true;
    L(d.day).extra.push({id:t.id+"~"+k,title:t.title,start:t.start,end:t.end,cat:t.cat,xp:t.xp,kind:t.kind||"",days:[]});
    persist([k,d.day]);closeLayer();toast("📅","Missão movida para "+WD_LONG[pkey(d.day).getDay()].toLowerCase()+".");render()},
  side:d=>{const k=today(),lg=L(k),s=SIDE.find(x=>x.id===d.id);if(!s)return;
    if(lg.side[s.id]){const v=lg.side[s.id];delete lg.side[s.id];S.xp=Math.max(0,S.xp-v.xp);S.coins=Math.max(0,S.coins-v.coins);persist([k]);render();return}
    const c=coinsFor(s.xp);lg.side[s.id]={xp:s.xp,coins:c,cat:s.cat};const lv=gain(s.xp,c,k);chime(false);toast("✨",`${s.t}: +${s.xp} XP`);checkAchievements();render();if(lv)levelUp(lv)},
  checkin:()=>checkinSheet(),
  ciMood:(d,el)=>{L(today()).mood=+d.i;el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===el))},
  ciPrio:(d,el)=>{const lg=L(today());lg.priority=lg.priority===d.k?null:d.k;el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===el&&!!lg.priority))},
  ciDone:()=>{const lg=L(today());lg.checkedIn=true;persist([today()]);closeLayer();render();toast("☀️",QUOTES[new Date().getDate()%QUOTES.length])},
  checkout:()=>checkoutSheet(),
  coMood:(d,el)=>{$("#layer .sheet").dataset.mood=d.i;el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===el))},
  coDone:()=>{const sh=$("#layer .sheet"),k=today(),lg=L(k);const m=sh.dataset.mood;
    lg.checkout={did:$("#coDid").value.trim(),win:$("#coWin").value.trim(),imp:$("#coImp").value.trim(),mood:m===""?null:+m};
    if(typeof lg.mood!=="number"&&m!=="")lg.mood=+m;
    persist([k]);summary();render()},
  newTask:d=>taskEditor(null,d.wd!==undefined?+d.wd:undefined),
  editTask:d=>{const t=S.routine.find(x=>x.id===d.id);if(t)taskEditor(t)},
  tfDay:(d,el)=>el.setAttribute("aria-pressed",el.getAttribute("aria-pressed")!=="true"),
  delTask:(d,el)=>{if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="Tocar de novo para apagar";return}S.routine=S.routine.filter(x=>x.id!==d.id);persist();closeLayer();toast("🗑️","Missão apagada");render()},
  pickDay:d=>{rotinaDay=d.k;render()},
  epic:d=>{if(S.epics[d.id])return;const m={projeto:[500,200],corpo:[1000,250],mestre:[600,150]}[d.id];S.epics[d.id]=today();const k=today();const lg=L(k);lg.bonus=(lg.bonus||0)+m[0];lg.bonusCoins=(lg.bonusCoins||0)+m[1];
    const lv=gain(m[0],m[1],k);celebrate({title:d.id==="corpo"?"Disciplina de Ferro":"Missão épica concluída!",sub:"Conquista especial desbloqueada.",xp:m[0],coins:m[1],lvUp:lv,first:true});render()},
  addMoment:()=>momentSheet(),
  mEmoji:(d,el)=>el.parentElement.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b===el)),
  saveMoment:async()=>{const t=$("#mText").value.trim();if(!t){toast("📝","Escreve uma frase sobre o momento.");return}
    const e=($("#mEmo .chip[aria-pressed=true]")||{}).dataset?.e||"⭐";const f=$("#mImg").files[0];const img=f?await resizeImage(f):null;
    const m={id:"m"+uid(),k:today(),e,t,img,at:Date.now()};S.moments.unshift(m);dirty.moments.add(m.id);persist();closeLayer();toast(e,"Momento guardado");render()},
  delMoment:(d,el)=>{if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="Apagar?";return}S.moments=S.moments.filter(m=>m.id!==d.id);dirty.delMoments.add(d.id);persist();render()},
  editName:()=>openSheet(`<h2>O teu nome</h2><form id="nf" class="stack" style="margin-top:14px"><input class="input" id="nfName" maxlength="30" value="${esc(S.name)}"><button class="btn btn-primary btn-block" type="submit">Guardar</button></form>`,el=>el.querySelector("#nf").addEventListener("submit",e=>{e.preventDefault();S.name=$("#nfName").value.trim();persist();closeLayer();render()})),
  addReward:()=>openSheet(`<h2>Nova recompensa</h2><p class="muted" style="margin-top:4px">Algo real que queres oferecer a ti próprio.</p><form id="rf" class="stack" style="margin-top:14px;gap:12px"><label class="field">Recompensa<input class="input" id="rfT" required maxlength="50" placeholder="Ex.: Ténis novos"></label><label class="field">Custo em moedas<input class="input" id="rfC" type="number" min="50" step="50" value="1500" required></label><button class="btn btn-primary btn-block" type="submit">Adicionar</button></form>`,el=>el.querySelector("#rf").addEventListener("submit",e=>{e.preventDefault();S.rewards.push({id:"r"+uid(),t:$("#rfT").value.trim(),c:Math.max(50,+$("#rfC").value||500),n:0});persist();closeLayer();render()})),
  redeem:d=>{const r=S.rewards.find(x=>x.id===d.id);if(!r||S.coins<r.c)return;S.coins-=r.c;r.n=(r.n||0)+1;persist();chime(true);openOverlay(`${sparks()}<div class="burst">🎁</div><h2 class="big">Recompensa desbloqueada</h2><p class="muted">${esc(r.t)}. Mereceste.</p><button class="btn btn-primary" style="margin-top:16px;min-width:200px" data-act="closeLayer">Aproveitar</button>`,"celebrate");render()},
  delReward:(d,el)=>{if(el.dataset.sure!=="1"){el.dataset.sure="1";el.textContent="?";return}S.rewards=S.rewards.filter(x=>x.id!==d.id);persist();render()},
  shopTab:d=>{shopTab=d.t;render()},
  shopItem:d=>{const it=SHOP[shopTab].find(x=>x.id===d.id);if(!it)return;const own=S.owned.includes(it.id)||it.c===0;
    if(!own){if(S.coins<it.c){toast("🪙",`Faltam ${it.c-S.coins} moedas para ${it.n}.`);return}S.coins-=it.c;S.owned.push(it.id);toast("🛍️",it.n+" desbloqueado")}
    if(shopTab==="acc"){const a=S.avatar.acc;const i=a.indexOf(it.id);if(i>=0&&own)a.splice(i,1);else if(i<0)a.push(it.id)}
    else if(shopTab==="title")S.avatar.title=S.avatar.title===it.id&&own?"":it.id;
    else S.avatar[shopTab]=it.id;
    persist();render()},
  toggle:d=>{S.settings[d.k]=!S.settings[d.k];applySettings();persist();render()},
  export:()=>{const json=JSON.stringify(S,null,2);openSheet(`<h2>Exportar dados</h2><p class="muted" style="margin-top:4px">Copia este texto e guarda-o onde quiseres.</p><textarea class="input" id="exp" rows="8" readonly style="margin-top:12px;font-family:ui-monospace,monospace;font-size:11px">${esc(json)}</textarea><button class="btn btn-primary btn-block" style="margin-top:12px" data-act="copyExp">Copiar</button>`)},
  copyExp:()=>{const ta=$("#exp");navigator.clipboard.writeText(ta.value).then(()=>toast("📋","Dados copiados")).catch(()=>{ta.focus();ta.select();toast("📋","Texto selecionado. Copia manualmente.")})},
  wipe:()=>openSheet(`<h2>Apagar todos os dados?</h2><p class="muted" style="margin-top:6px">XP, moedas, conquistas, momentos e a rotina personalizada serão removidos. Não é possível desfazer.</p><div class="row" style="margin-top:16px;gap:8px"><button class="btn btn-ghost grow" data-act="closeSheet">Cancelar</button><button class="btn grow" style="background:#5a1d33;color:#ffd6e0" data-act="wipeYes">Apagar</button></div>`),
  wipeYes:async()=>{const oldDays=Object.keys(S.log),oldM=S.moments.map(m=>m.id);S=freshState();try{localStorage.removeItem(LS)}catch(e){}closeLayer();
    if(profileRef){try{await profileRef.delete();for(const k of oldDays)await profileRef.collection("days").doc(k).delete();for(const id of oldM)await profileRef.collection("moments").doc(id).delete()}catch(e){}}
    onb={step:0,areas:null,name:"",goal:""};boot()},
  onbNext:()=>{if(onb.step===2)onb.name=($("#onbName")||{}).value?.trim()||"";onb.step++;renderOnb()},
  onbBack:()=>{if(onb.step===2)onb.name=($("#onbName")||{}).value?.trim()||"";onb.step=Math.max(0,onb.step-1);renderOnb()},
  onbArea:d=>{const a=onb.areas;const i=a.indexOf(d.k);i>=0?a.splice(i,1):a.push(d.k);renderOnb()},
  onbGoal:d=>{onb.goal=d.g;renderOnb()},
  onbFinish:()=>{S.onboarded=true;S.name=onb.name;S.areas=onb.areas;S.goal=onb.goal;persist();boot();firstMission()},
  firstDone:()=>{const k=today(),lg=L(k);lg.done["first"]={xp:40,coins:10,cat:"autocuidado",kind:"",min:5,at:Date.now(),title:"Começar o dia"};S.firstDone=true;
    const lv=gain(40,10,k);celebrate({title:"Primeira missão concluída!",sub:"O primeiro passo foi dado.",xp:40,coins:10,lvUp:lv,first:true,streak:true});checkAchievements();render()},
  demo:()=>{seedDemo();boot()},
  mmExit:()=>{MM=null;closeLayer();render()},
  mmDur:(d,el)=>{MM.dur=+d.m;drawMission()},
  mmStart:()=>{MM.phase="run";MM.started=Date.now();MM.paused=0;MM.pausedAt=null;drawMission();toast("⚡","Missão iniciada.");stopTimer();timerInt=setInterval(tick,500)},
  mmPause:()=>{if(MM.pausedAt){MM.paused+=Date.now()-MM.pausedAt;MM.pausedAt=null;timerInt=setInterval(tick,500)}else{MM.pausedAt=Date.now();stopTimer()}drawMission()},
  mmDone:()=>{const {t,k}=MM;stopTimer();MM=null;completeTask(t,k);render()},
  mmReduced:()=>{const {t,k}=MM;stopTimer();MM=null;reducedSheet(t,k)}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el,e)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML&&!MM)closeLayer()});

/* ---------- render / boot ---------- */
function applySettings(){document.body.classList.toggle("calm",!!S.settings.calm)}
function render(){
  if(!S.onboarded){$("#nav").hidden=true;renderOnb();return}
  $("#nav").hidden=false;
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const v=$("#view"),top=v.scrollTop;
  v.innerHTML=({hoje:renderHoje,jornada:renderJornada,rotina:renderRotina,evolucao:renderEvolucao,perfil:renderPerfil})[tab]();
  v.scrollTop=top;
}
let lastNotif="";
function notifLoop(){
  if(!S.onboarded||!S.settings.notif)return;
  const k=today(),n=nowMin();
  tasksFor(k).forEach(t=>{const key=k+t.id+t.start;if(toMin(t.start)===n&&lastNotif!==key&&statusOf(t,k)!=="done"){lastNotif=key;toast(CATS[t.cat].e,CAT_NOTIF[t.cat].replace(/^\S+\s/,"")+" "+t.title+".")}});
}
let lastDay=today();
setInterval(()=>{notifLoop();if(today()!==lastDay){lastDay=today();render()}else if(tab==="hoje"&&!$("#layer").innerHTML)render()},30000);
function boot(){
  applySettings();render();
  if(S.onboarded){const lg=S.log[today()];if(!(lg&&lg.checkedIn)&&new Date().getHours()>=5&&!$("#layer").innerHTML&&S.firstDone)setTimeout(()=>{if(!$("#layer").innerHTML)checkinSheet()},500)}
  checkAchievements();
}
boot();
connectAccount();
</script>
</body>
</html>
